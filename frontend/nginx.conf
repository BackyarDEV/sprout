server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 10.89.1.1 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8490;
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}